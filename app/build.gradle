plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.mobile.ytdownload'
    compileSdk 36

    defaultConfig {
        applicationId 'ru.mobile.ytdownload'
        minSdk 33
        targetSdk 35
        versionCode 3
        versionName '3.0-video-audio'
    }
    buildTypes {
        release {
            minifyEnabled false
            // For distribution, configure your own release signing key.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.27.1'
}
